<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lead Generation Agent{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-md app-nav">
    <div class="container-xxl">
      <a class="navbar-brand" href="{{ url_for('index') }}"><i class="bi bi-bullseye"></i> Lead Generation Agent</a>
      <div class="navbar-nav flex-row gap-3 ms-auto">
        <a class="nav-link" href="{{ url_for('index') }}">Search</a>
        <a class="nav-link" href="{{ url_for('history') }}">History</a>
      </div>
    </div>
  </nav>
  <main class="container-xxl py-4">
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
